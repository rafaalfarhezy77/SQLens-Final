name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sqlens-frontend/package-lock.json
      - name: Install dependencies
        working-directory: sqlens-frontend
        run: npm ci
      - name: TypeScript
        working-directory: sqlens-frontend
        run: npm run typecheck
      - name: Biome lint
        working-directory: sqlens-frontend
        run: npm run check
      - name: Tests and coverage
        working-directory: sqlens-frontend
        run: npm run test:coverage
      - name: Production build
        working-directory: sqlens-frontend
        run: npm run build
      - name: SonarQube scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: sqlens-frontend
